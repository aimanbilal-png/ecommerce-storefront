<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                ShopEase
            </a>

           <nav class="nav-links">

    <a href="index.html">
        Home
    </a>

    <a href="index.html#products">
        Products
    </a>

    <a href="cart.html">
        Cart <span id="cart-count">0</span>
    </a>

    <a href="checkout.html">
        Checkout
    </a>

</nav>

        </div>

    </header>


    <main class="container product-details-section">

        
        <div id="product-loading" class="loading">
            <p>Loading product...</p>
        </div>


        
        <div id="product-error" class="error-message hidden">

            <p>Product could not be found.</p>

            <a href="index.html" class="btn">
                Back to Store
            </a>

        </div>


        <div id="product-details" class="product-details hidden">

            <!-- Image -->
            <div class="product-details-image-box">

                <img
                    id="detail-image"
                    src=""
                    alt="Product"
                >

            </div>

            <div class="product-details-info">

                <p
                    id="detail-category"
                    class="product-category">
                </p>

                <h1 id="detail-title"></h1>

                <div class="product-rating">
                    <span id="detail-rating"></span>
                </div>

                <p
                    id="detail-description"
                    class="detail-description">
                </p>

                <h2
                    id="detail-price"
                    class="detail-price">
                </h2>

                <button
                    id="detail-add-cart"
                    class="btn detail-cart-btn">
                    Add to Cart
                </button>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="container">

            <h3>ShopEase</h3>

            <p>
                Your simple and modern online shopping experience.
            </p>

            <p class="copyright">
                © 2026 ShopEase. All rights reserved.
            </p>

        </div>

    </footer>

 
    <script src="js/product.js"></script>

</body>
</html>
